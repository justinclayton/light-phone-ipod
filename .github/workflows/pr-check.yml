name: PR Check

on:
  pull_request:
    branches: [main]
  # setup-gradle only saves its cache from the default branch, so without a
  # main-branch run every PR build starts cold.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The job always runs (so a required "Gradle check" status is still
      # reported), but the expensive steps are skipped for docs-only PRs.
      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -Ev '(\.md$|^docs/|^\.scratch/|^LICENSE|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)|^\.gitignore$)' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changes:"; echo "$code"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only non-code files changed; skipping build."
          fi

      - name: Set up JDK 17
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run ciCheck
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew ciCheck
