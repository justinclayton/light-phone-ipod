[tool]
id = "com.thelightphone.ipod"
label = "iPod"
versionCode = 1
versionName = "0.1.0"
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.CAMERA"]
# Detached playback: the queue keeps playing (and LightOS shows transport
# controls) after the tool is closed. See docs/design_decisions/detached_audio.md.
capabilities = ["detached-audio"]
# Preferred SDK server. LightSdkApplication falls back to whichever server is
# actually installed (LightOS on a real LP3, the emulator app on an AVD), so
# the same debug APK runs on both without editing this line.
serverPackage = "com.lightos"
